    <script id="ld-faq" type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Как проверить, годна ли АКБ пожарной сигнализации?","acceptedAnswer":{"@type":"Answer","text":"Разрядить батарею током Cном/10 до 10,5 В на 12-вольтовую АКБ (1,75 В на элемент), замерить время разряда tр, посчитать фактическую ёмкость Cф = Iр·tр и привести её к 25 °C. Если при первой проверке остаточная ёмкость не ниже 80 % номинала — АКБ годна (ГОСТ Р 59638)."}},{"@type":"Question","name":"Каким током разряжать АКБ при проверке?","acceptedAnswer":{"@type":"Answer","text":"Контрольный разряд ведётся током 10-часового режима: Iр = Cном/10. Например, для батареи 17 А·ч — 1,7 А. Конечное напряжение — 10,5 В на 12-вольтовую АКБ, то есть 1,75 В на элемент."}},{"@type":"Question","name":"До какого напряжения разряжать батарею при проверке?","acceptedAnswer":{"@type":"Answer","text":"Для 12-вольтовой АКБ — до 10,5 В на батарею, то есть 1,75 В на элемент (в 12-В блоке 6 элементов). Встречающаяся в статьях формулировка «10,5 В на элемент» ошибочна — это напряжение всей батареи. Разряд ниже конечного напряжения повреждает АКБ, поэтому напряжение контролируют в течение всего теста."}},{"@type":"Question","name":"Зачем приводить ёмкость к 25 °C?","acceptedAnswer":{"@type":"Answer","text":"Ёмкость свинцово-кислотной батареи зависит от температуры: на холоде она ниже. Чтобы сравнить результат с номиналом (заданным при 25 °C), измеренную ёмкость делят на K = 1 + 0,006·(t − 25)."}}]}</script>
