    <script id="ld-faq" type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Какой дисбаланс допускается между притоком и дымоудалением?","acceptedAnswer":{"@type":"Answer","text":"По п. 7.4 СП 7.13130 при совместном действии приточной и вытяжной противодымной вентиляции отрицательный дисбаланс в защищаемом помещении допускается не более 30 %, а положительный дисбаланс не допускается вообще. То есть компенсирующий приток должен быть не менее 70 % и не более 100 % от удаляемого расхода. Дополнительно перепад давления на закрытых дверях эвакуационных выходов не должен превышать 150 Па."}},{"@type":"Question","name":"Почему баланс считается по массовому расходу, а не по объёмному?","acceptedAnswer":{"@type":"Answer","text":"Удаляемые продукты горения горячие (200–600 °C) и потому лёгкие: ρ = 353/(273+t). При 400 °C плотность около 0,52 кг/м³, а у наружного воздуха при 20 °C — 1,20 кг/м³, то есть более чем вдвое выше. Сравнение объёмных расходов при разных температурах даёт ошибку в разы, поэтому дисбаланс сопоставляется по массе. СП прямо этого не уточняет — такая трактовка принята в калькуляторе и указана в ходе расчёта."}},{"@type":"Question","name":"Какая скорость допускается в проёмах компенсирующего притока?","acceptedAnswer":{"@type":"Answer","text":"При естественном притоке через двери наружных эвакуационных выходов суммарная площадь проходного сечения определяется по условию непревышения скорости воздушного потока в дверных проёмах более 6 м/с (п. 8.8 СП 7.13130). Проёмы для естественного притока должны располагаться в нижней части защищаемого помещения."}},{"@type":"Question","name":"Считает ли калькулятор сам расход дымоудаления?","acceptedAnswer":{"@type":"Answer","text":"Нет. Расход удаляемых продуктов горения определяется отдельным расчётом по пп. 7.2–7.5 СП 7.13130 — от мощности тепловыделения очага, теплопотерь через ограждения, температуры продуктов горения и геометрии дымовой зоны; фиксированные значения температуры принимать без расчёта не допускается. Этот калькулятор проверяет баланс притока и удаления по уже полученному расходу."}}]}</script>
