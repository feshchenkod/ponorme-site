    <script id="ld-faq" type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Чем это отличается от «Подложки из PDF»?","acceptedAnswer":{"@type":"Answer","text":"Подложка — для сканов и фотографий: там внутри картинка, и она ставится в чертёж растром под обводку. Здесь наоборот: если PDF выгружен из САПР, в нём лежат настоящие линии — они переносятся в DXF как геометрия, обводить ничего не нужно. Если в файле не найдётся векторной геометрии, инструмент прямо об этом скажет и отправит к подложке."}},{"@type":"Question","name":"Сохранятся ли слои исходного чертежа?","acceptedAnswer":{"@type":"Answer","text":"Нет — при печати в PDF слои DWG теряются безвозвратно, остаётся только внешний вид. Единственный устойчивый признак — цвет, поэтому линии группируются по цветам: каждая группа становится слоем DXF (LINII-FF0000 и т. п.), ненужные группы отключаются перед выгрузкой."}},{"@type":"Question","name":"Почему окружности и дуги стали ломаными?","acceptedAnswer":{"@type":"Answer","text":"В самом PDF нет дуг — только отрезки и кривые Безье: всё круглое превратилось в кривые ещё при печати из САПР. Кривые спрямляются адаптивно с малым допуском, поэтому визуально дуги остаются гладкими; при необходимости их можно перечертить по месту."}},{"@type":"Question","name":"Что будет с текстом и размерами?","acceptedAnswer":{"@type":"Answer","text":"Надписи переносятся однострочным текстом (слой TEKST, шрифт Standard) со своей позицией, высотой и углом — начертание исходного шрифта не сохраняется. Размеры приезжают «разобранными»: линии отдельно, числа отдельно, размерными объектами AutoCAD они не станут. Текст, преобразованный при печати в кривые, приедет контурами, а не текстом."}},{"@type":"Question","name":"Как чертёж попадает в натуральную величину?","acceptedAnswer":{"@type":"Answer","text":"PDF знает только размер бумаги. Укажите масштаб печати (1:100 и т. д.) — или, если он нестандартный («вписать в лист»), откалибруйте по известному размеру: два щелчка по концам размерной цепочки и её значение в миллиметрах. Инструмент покажет, какому масштабу это соответствует."}},{"@type":"Question","name":"Что не переносится?","acceptedAnswer":{"@type":"Answer","text":"Растровые вставки (логотипы, подложки) — для них есть «Подложка из PDF». Штриховки приезжают множеством линий или контуров — такие группы легко отключить. Обрезка областей не применяется: линии, спрятанные при печати за границей видимости, могут появиться. Заливки переносятся контурами, без заполнения."}}]}</script>
