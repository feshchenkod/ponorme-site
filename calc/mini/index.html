    <script id="ld-faq" type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Как посчитать падение напряжения в линии питания приборов?","acceptedAnswer":{"@type":"Answer","text":"ΔU = ρ·2·L·I/S, где ρ = 0,0175 Ом·мм²/м для меди, L — длина линии в одну сторону (множитель 2 учитывает оба провода), I — ток, S — сечение жилы. Например, 100 м линии 1,5 мм² при 1 А теряют 2,3 В — критично для приборов на 12 В."}},{"@type":"Question","name":"Какое падение напряжения допустимо?","acceptedAnswer":{"@type":"Answer","text":"Единой нормы для слаботочных линий нет — предел задаёт диапазон питания прибора из его ТД. Типовой приём: прибор с диапазоном 10,2…28,4 В при резерве от АКБ 12 В получает около 10,5–11 В с учётом разряда, поэтому на линию закладывают не более 5–10 % номинала. Точнее — сверьте минимальное входное напряжение прибора с напряжением АКБ в конце разряда (10,5 В)."}},{"@type":"Question","name":"Как быстро сложить токи из спецификации?","acceptedAnswer":{"@type":"Answer","text":"Вставьте текст со значениями в поле «Сумма токов» — все числа найдутся и сложатся автоматически. Коды моделей вроде «С2000-4» или «ДИП-34А» не считаются: числа, приклеенные к буквам, пропускаются. Значение с единицей пишите через пробел: «0,5 мА»."}}]}</script>
