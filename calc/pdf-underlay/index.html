    <script id="ld-faq" type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Получится ли из PDF настоящий вектор — линии и полилинии?","acceptedAnswer":{"@type":"Answer","text":"Внутри скана или фотографии нет ни линий, ни координат — полностью восстановить чертёж можно только обводкой, и этот инструмент готовит для неё подложку. Обводку сокращает «черновой вектор»: длинные горизонтальные и вертикальные прямые находятся автоматически и укладываются красным слоем в тот же DXF, лишнее из них удаляется в AutoCAD рамкой. Векторные PDF (выгруженные из AutoCAD или Revit) — отдельная задача, её мы делаем следующей."}},{"@type":"Question","name":"Что такое «черновой вектор» и чего от него ждать?","acceptedAnswer":{"@type":"Answer","text":"Поиск длинных прямых на листе: стены и оси обычно находятся, но вместе с ними в черновик попадают и размерные линии. Текст, штриховка и косые линии не ищутся намеренно — черновик должен сокращать обводку, а не заваливать чертёж мусором. Порог минимальной длины настраивается ползунком, результат виден поверх листа до выгрузки. На сканах печатных чертежей качество заметно выше, чем на снимках от руки."}},{"@type":"Question","name":"Зачем калибровать масштаб?","acceptedAnswer":{"@type":"Answer","text":"Чтобы подложка встала в натуральную величину и с неё можно было обводить сразу в миллиметрах. Укажите на листе два конца известного размера — например крайние выносные линии размерной цепочки — и введите это расстояние. Если размерных чисел не видно, масштаб принимается условно по формату листа, и такой лист помечается в чертеже требующим калибровки."}},{"@type":"Question","name":"Насколько точна подложка?","acceptedAnswer":{"@type":"Answer","text":"Скан даёт равномерный масштаб, снимок с рук — нет: перспектива растягивает лист по полю, расхождение между размерами в разных частях может доходить до нескольких процентов. Программа выправляет поворот и перекос, но не перспективу. Поэтому подложка годится для обводки, расстановки оборудования и прикидки трасс, а размеры для спецификации берут с проставленных на чертеже чисел."}},{"@type":"Question","name":"Почему результат отдаётся архивом?","acceptedAnswer":{"@type":"Answer","text":"Растр в DXF подключается ссылкой на файл, а не встраивается внутрь. В архиве лежат DXF и каталог img с подложками — распаковывать нужно целиком и держать рядом. При передаче проекта пользуйтесь ФОРМКОМПЛЕКТ (ETRANSMIT), он соберёт связанные файлы."}},{"@type":"Question","name":"Почему DXF формата AutoCAD 2000, а не R12?","acceptedAnswer":{"@type":"Answer","text":"В R12 сущности IMAGE не существует как класса, растровую подложку туда положить нельзя. AC1015 читают AutoCAD (включая LT), nanoCAD и другие редакторы."}},{"@type":"Question","name":"Что делать с многостраничным PDF?","acceptedAnswer":{"@type":"Answer","text":"Каждая страница становится отдельным листом: со своим названием, поворотом, масштабом и слоем. В чертеже листы стоят в ряд слева направо с зазором, ненужные можно отключить перед выгрузкой."}},{"@type":"Question","name":"Можно ли загрузить фотографии без PDF?","acceptedAnswer":{"@type":"Answer","text":"Да: JPG, PNG и WebP открываются напрямую, в том числе несколько сразу — каждая фотография становится листом, ориентация из EXIF учитывается. HEIC с iPhone браузеры не читают: снимайте в «наиболее совместимом» формате или сохраните снимок как JPEG."}}]}</script>
