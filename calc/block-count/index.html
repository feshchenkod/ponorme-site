    <script id="ld-faq" type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Как посчитать количество блоков в AutoCAD?","acceptedAnswer":{"@type":"Answer","text":"Штатно — команда БЛОКСЧЁТ (_BCOUNT) из Express Tools или мастер извлечения данных (ДАННЫЕИЗВЛ), но первый считает всё подряд без группировки, а второй требует настройки на каждый чертёж. Здесь правила «маска имени → наименование» задаются один раз: LSP-команда считает по ним любой чертёж и сразу даёт строки спецификации, а не сырой список имён."}},{"@type":"Question","name":"Как считаются динамические блоки?","acceptedAnswer":{"@type":"Answer","text":"LSP-команда берёт эффективное (исходное) имя, поэтому все состояния динамического блока попадают в одну строку. В браузерном подсчёте по DXF динамические блоки видны под служебными именами (*U…) — если они есть, сервис предупредит; точный итог по таким блокам даст команда в AutoCAD."}},{"@type":"Question","name":"Что попадает в подсчёт, а что нет?","acceptedAnswer":{"@type":"Answer","text":"Вставки блоков в пространстве модели (по желанию — и на листах). Вложенные в другие блоки вставки не считаются — как и в штатных инструментах: одна вставка сборного блока это одна единица. MINSERT-массивы считаются по числу элементов. Блоки, не попавшие ни под одну маску, показываются отдельным итогом «мимо масок»."}},{"@type":"Question","name":"Куда выводится результат?","acceptedAnswer":{"@type":"Answer","text":"Всегда — отчёт в командную строку. По настройкам скрипт дополнительно вставит таблицу «Спецификация оборудования» в чертёж (точку укажете при запуске) и сохранит CSV с разделителем «;» — такой файл Excel открывает двойным кликом. Подсчёт по DXF в браузере можно скачать в Excel сразу со страницы."}},{"@type":"Question","name":"Работает ли с блоками УГО из вашей библиотеки?","acceptedAnswer":{"@type":"Answer","text":"Да, кнопка «Блоки УГО ПоНорме» подставляет правила для всех блоков комплекта /calc/ugo с полными наименованиями по РД 25.953-90 — спецификация получается готовыми формулировками. Свои блоки добавляются масками: например, «ДИП*,ИП212*» → «Извещатель дымовой»."}}]}</script>
