    <script id="ld-faq" type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Как подобрать сечение воздуховода по расходу воздуха?","acceptedAnswer":{"@type":"Answer","text":"Требуемая площадь S = L/(3600·v), где L — расход (м³/ч), v — принятая скорость (м/с). Для круглого воздуховода диаметр d = √(4S/π), далее берётся ближайший стандартный диаметр не меньше расчётного. Для прямоугольного одна сторона задаётся по строительным ограничениям, вторая подбирается из типового ряда."}},{"@type":"Question","name":"Какую скорость воздуха принимать?","acceptedAnswer":{"@type":"Answer","text":"Справочно: магистрали жилых и общественных зданий — 4–6 м/с, ответвления и подводки к решёткам — 2–4 м/с, воздухораспределители — 1,5–3 м/с (ограничение по шуму), магистрали производственных зданий — 6–12 м/с. Это практика проектирования, а не норматив: в системах противодымной вентиляции скорости определяются расчётом по СП 7.13130."}},{"@type":"Question","name":"Зачем нужен эквивалентный диаметр прямоугольного воздуховода?","acceptedAnswer":{"@type":"Answer","text":"Таблицы и номограммы аэродинамического расчёта составлены для круглых воздуховодов. Чтобы ими воспользоваться для прямоугольного сечения, считают эквивалентный по трению диаметр dэ = 1,3·(a·b)^0,625/(a+b)^0,25 — потери давления на трение у такого круглого воздуховода будут теми же. Для расчёта скорости эквивалентный диаметр не применяется: скорость считается по фактической площади a·b."}}]}</script>
