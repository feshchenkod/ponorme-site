    <script id="ld-faq" type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Как рассчитать вентиляцию помещения по кратности?","acceptedAnswer":{"@type":"Answer","text":"Требуемый расход воздуха L = n·V, где V — объём помещения (м³), n — кратность воздухообмена (ч⁻¹) — сколько раз в час воздух должен полностью замениться. Кратность берётся из профильного СП для вашего типа помещения или из справочника типовых значений."}},{"@type":"Question","name":"Почему расчёт по кратности — оценочный?","acceptedAnswer":{"@type":"Answer","text":"СП 60.13330 требует определять воздухообмен расчётом: по людям (санитарная норма наружного воздуха), по вредностям, влаге или теплоизбыткам. Кратность — упрощённый справочный метод: он даёт стартовую оценку и применяется, когда профильный СП нормирует именно кратность. Для санузлов и кухонь нормируются фиксированные расходы (м³/ч), а не кратность."}},{"@type":"Question","name":"Какую скорость воздуха принимать в воздуховоде?","acceptedAnswer":{"@type":"Answer","text":"Для магистральных воздуховодов жилых и общественных зданий типово 4–6 м/с, для ответвлений и решёток 2–4 м/с (ограничение — шум), для производственных систем до 8–12 м/с. Фактическая скорость в подобранном стандартном диаметре получается ниже целевой — сечение принимается с запасом."}}]}</script>
