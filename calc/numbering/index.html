    <script id="ld-faq" type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Как работает нумерация?","acceptedAnswer":{"@type":"Answer","text":"Команда спрашивает начальный номер (по умолчанию — продолжение прошлой серии), дальше каждый щелчок ставит подпись и увеличивает номер на шаг. Enter или Esc завершает серию; итог и следующий номер печатаются в командной строке."}},{"@type":"Question","name":"Ошибся в середине линии — как исправить?","acceptedAnswer":{"@type":"Answer","text":"Завершите серию, удалите неверные подписи и запустите команду снова с нужного начального номера — он спрашивается при каждом запуске. Одно U откатывает всю серию целиком."}},{"@type":"Question","name":"Почему предупреждение после 127?","acceptedAnswer":{"@type":"Answer","text":"127 — ёмкость ДПЛС одного С2000-КДЛ. Команда предупреждает, но нумерацию не останавливает; лимит в форме можно изменить или отключить (0). Для второй линии обычно начинают новую серию с префиксом, например «2.»."}},{"@type":"Question","name":"Подписи — это текст или атрибуты блоков?","acceptedAnswer":{"@type":"Answer","text":"Однострочный текст (TEXT) на отдельном слое: работает с любыми блоками и без блоков, слой легко скрыть или отключить на печать. Запись адреса в атрибут требует одинаковой структуры всех блоков — такие атрибуты заполняются штатными средствами."}},{"@type":"Question","name":"Чем режим «к блоку» отличается от «в точку»?","acceptedAnswer":{"@type":"Answer","text":"«В точку» — подпись там, где щёлкнули. «К блоку» — щелчок по вставке блока, подпись встаёт у его точки вставки с заданным смещением: у всех датчиков одинаково, ровнее, чем на глаз."}},{"@type":"Question","name":"Работает ли в AutoCAD LT и nanoCAD?","acceptedAnswer":{"@type":"Answer","text":"AutoCAD LT поддерживает AutoLISP начиная с версии 2024; полный AutoCAD и nanoCAD — давно. SCR-варианта нет: команда интерактивная, командный сценарий так не умеет."}}]}</script>
