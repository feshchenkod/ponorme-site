    <script id="ld-faq" type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Как рассчитать СОУЭ по СП 3.13130?","acceptedAnswer":{"@type":"Answer","text":"Уровень звукового давления оповещателя в точке считается по формулам (В.1) и (В.2) приложения В: от чувствительности и мощности оповещателя с поправкой на расстояние. Затем расчётный уровень сравнивается с нормируемым: превышение над постоянным шумом помещения и абсолютные границы для этого типа помещений (п. 6.8.2–6.8.5, 6.9.1)."}},{"@type":"Question","name":"На сколько дБ звук оповещения должен превышать шум?","acceptedAnswer":{"@type":"Answer","text":"Не менее чем на 15 дБ, а в помещениях квартир и апартаментов — не менее чем на 10 дБ (п. 6.8.2 СП 3.13130). Превышение обеспечивается на высоте 1,5 м в любой точке помещения. Типовые уровни шума по видам помещений приведены в таблице В.1."}},{"@type":"Question","name":"Какие абсолютные уровни требует СП 3.13130?","acceptedAnswer":{"@type":"Answer","text":"Сигнал оповещения — не менее 65 дБА (в квартирах 55 дБА) и не более 110 дБА на высоте 1,5 м (п. 6.8.2, 6.8.4). В зданиях класса Ф1.1 — не более 95 дБА (п. 6.8.5). В спальных помещениях на уровне головы спящего — 75…95 дБА (п. 6.9.1). При шуме свыше 85 дБА — не менее 105 дБА, а по п. 6.2.13 дополнительно применяют световой и (или) тактильный способ, если шум нельзя автоматически снизить при пожаре."}},{"@type":"Question","name":"Почему нужно выбирать режим нормирования?","acceptedAnswer":{"@type":"Answer","text":"Требуемые уровни зависят от типа защищаемых помещений: жильё, спальные помещения и здания Ф1.1 нормируются отдельно от обычных помещений — различаются и запас над шумом, и абсолютные границы. Режим задаёт, с чем сравнивается расчётный уровень; выбранные пункты СП показываются в ходе расчёта и в отчёте."}},{"@type":"Question","name":"Что делать, если уровень звука недостаточен?","acceptedAnswer":{"@type":"Answer","text":"Увеличить мощность подключения оповещателя, сократить расстояние до оповещаемых или добавить оповещатели (п. В.6.2 СП 3.13130)."}},{"@type":"Question","name":"Почему нормы в дБА, а чувствительность оповещателя — в дБ?","acceptedAnswer":{"@type":"Answer","text":"СП 3.13130 нормирует уровни звука в дБА (частотное взвешивание А), причём требуемый уровень определяется как максимальный УЗД с временной коррекцией F по ГОСТ Р 53188.1. Чувствительность оповещателей в ТД по ГОСТ Р 53325 указывается в дБ. Методика приложения В оперирует этими величинами напрямую — расчётные уровни сравниваются с нормируемыми в дБА."}}]}</script>
