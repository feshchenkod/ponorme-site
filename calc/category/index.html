    <script id="ld-faq" type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Как определить категорию помещения В1, В2, В3 или В4?","acceptedAnswer":{"@type":"Answer","text":"По приложению Б СП 12.13130.2009: считается пожарная нагрузка Q (сумма произведений массы материалов на низшую теплоту сгорания), затем удельная нагрузка g = Q/S, и категория выбирается по таблице Б.1. Для В2 и В3 выполняется проверка повышения по формуле (Б.5)."}},{"@type":"Question","name":"Чем категории В отличаются от А и Б?","acceptedAnswer":{"@type":"Answer","text":"Категории А и Б — взрывопожароопасные (горючие газы, ЛВЖ) и определяются расчётом избыточного давления взрыва по приложению А. Категории В1–В4 — пожароопасные: помещение с горючими материалами, не отнесённое к А/Б (признаки — таблица 1), классифицируется по удельной пожарной нагрузке. Проверка ведётся от А к Д (п. 5.2)."}},{"@type":"Question","name":"Какое Q подставлять в проверку (Б.5): в СП написано «определённое по формуле (Б.2)»?","acceptedAnswer":{"@type":"Answer","text":"Это неточность печатного текста: по формуле (Б.2) считается удельная нагрузка g, а не Q. В неравенство (Б.5) подставляется полная пожарная нагрузка Q из формулы (Б.1) — так решены примеры Пособия ВНИИПО, и так считает калькулятор."}},{"@type":"Question","name":"Где взять низшую теплоту сгорания материалов?","acceptedAnswer":{"@type":"Answer","text":"В сервисе есть справочник, значения выверены по Пособию ВНИИПО и базе Кошмарова. Для материала не из списка теплоту сгорания можно ввести вручную."}}]}</script>
