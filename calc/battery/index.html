    <script id="ld-faq" type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"По какому СП рассчитывается ёмкость АКБ для пожарной сигнализации?","acceptedAnswer":{"@type":"Answer","text":"По приложению Б СП 6.13130.2025 (формула Б.1.1): ёмкость учитывает суммарные токи в дежурном режиме и режиме «Пожар», собственный ток источника питания, коэффициент старения Kстр и коэффициент Kн, учитывающий нагрузочные (токоразрядные) характеристики АКБ, — по разрядной таблице."}},{"@type":"Question","name":"Какое время резерва брать для АКБ?","acceptedAnswer":{"@type":"Answer","text":"По СП 6.13130 (приложение Б, п. Б.2) — 24 часа в дежурном режиме плюс 1 час в режиме «Пожар». В экспертном режиме можно задать другое время работы."}},{"@type":"Question","name":"Что такое коэффициент Kн и откуда он берётся?","acceptedAnswer":{"@type":"Answer","text":"Kн = Cном/Cфакт(t) — отношение номинальной ёмкости к фактически отдаваемой за время t по разрядной таблице АКБ. При Kн < 1 принимается равным 1 (в запас). В сервисе Kн считается автоматически по кривым разряда Delta и «Болид»."}},{"@type":"Question","name":"В печатном СП во втором слагаемом (Б.1.1) стоит ΣIд.р. — почему калькулятор подставляет ток режима «Пожар»?","acceptedAnswer":{"@type":"Answer","text":"Это опечатка печатного текста: второе слагаемое описывает работу в режиме «Пожар» (в нём Kнр.п. и tр.п.), поэтому физически в него входит ток этого режима ΣIр.п. Подстановка ΣIд.р. занизила бы ёмкость при токе «Пожара» выше дежурного. Калькулятор считает с ΣIр.п.; отклонение явно указано в описании методики."}}]}</script>
